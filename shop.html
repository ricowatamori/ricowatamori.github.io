<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHOP｜Noctiluca｜綿森りこ</title>

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
}

body {
  background:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,.72) 0 2px, transparent 3px),
    radial-gradient(circle at 86% 28%, rgba(255,255,255,.7) 0 3px, transparent 4px),
    radial-gradient(circle at 20% 78%, rgba(255,255,255,.55) 0 2px, transparent 3px),
    #fceff2;
  background-size: 180px 180px, 240px 240px, 210px 210px;
  text-align: center;
  color: #a56580;
}

.header {
  width: 100%;
  max-width: 1226px;
  margin: 0 auto;
  padding: 42px 20px 22px;
}

.header h1 {
  margin: 0;
  font-family: serif;
  font-size: 42px;
  font-weight: normal;
  letter-spacing: 0.25em;
  text-shadow: 0 2px 0 rgba(255,255,255,.8);
}

.header p {
  margin: 12px 0 0;
  font-family: serif;
  font-size: 13px;
  letter-spacing: 0.16em;
}

.nav {
  display: flex;
  justify-content: center;
  gap: 30px;
  padding: 0 20px 28px;
}

.nav a {
  position: relative;
  color: #a56580;
  text-decoration: none;
  font-family: serif;
  font-size: 13px;
  letter-spacing: 0.13em;
  transition: opacity .2s ease, transform .2s ease;
}

.nav a:hover {
  opacity: .65;
  transform: translateY(-2px);
}

.nav a::after {
  content: "✦";
  position: absolute;
  left: 50%;
  bottom: -16px;
  transform: translateX(-50%);
  font-size: 8px;
  opacity: 0;
  transition: opacity .2s ease;
}

.nav a:hover::after {
  opacity: .7;
}

.shop {
  width: min(900px, calc(100% - 40px));
  margin: 0 auto;
  padding: 45px 0 105px;
}

.shop-title {
  margin: 0;
  font-family: serif;
  font-size: 31px;
  font-weight: normal;
  letter-spacing: 0.2em;
}

.shop-subtitle {
  margin: 13px 0 38px;
  font-family: serif;
  font-size: 13px;
  letter-spacing: 0.2em;
}

.shop-card {
  position: relative;
  overflow: hidden;
  background: rgba(255,246,249,.92);
  border: 1px solid rgba(216,137,170,.38);
  border-radius: 28px;
  padding: 65px 30px 58px;
  box-shadow: 0 12px 35px rgba(165,101,128,.08);
}

.shop-card::before,
.shop-card::after {
  position: absolute;
  color: rgba(216,137,170,.5);
  font-size: 24px;
  font-family: serif;
}

.shop-card::before {
  content: "✧";
  top: 22px;
  left: 28px;
}

.shop-card::after {
  content: "✦";
  right: 28px;
  bottom: 22px;
  font-size: 18px;
}

.shop-card h2 {
  margin: 0 0 22px;
  font-family: serif;
  font-size: 27px;
  font-weight: normal;
  letter-spacing: 0.14em;
}

.shop-card p {
  margin: 0 auto 38px;
  max-width: 600px;
  font-family: serif;
  font-size: 15px;
  line-height: 2.1;
  letter-spacing: 0.1em;
}

.shop-button {
  display: inline-block;
  position: relative;
  padding: 15px 42px;
  border: 1px solid #d889aa;
  border-radius: 999px;
  color: #a56580;
  background: #fffafd;
  text-decoration: none;
  font-family: serif;
  font-size: 14px;
  letter-spacing: 0.16em;
  box-shadow: 0 5px 15px rgba(165,101,128,.1);
  transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
}

.shop-button:hover {
  opacity: .85;
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(165,101,128,.15);
}

.shop-button::after {
  content: "  ↗";
  font-size: 13px;
}

.back-button {
  display: inline-block;
  margin-top: 42px;
  padding: 12px 30px;
  border: 1px solid rgba(216,137,170,.7);
  border-radius: 999px;
  color: #a56580;
  background: transparent;
  text-decoration: none;
  font-family: serif;
  font-size: 13px;
  letter-spacing: 0.15em;
  transition: opacity .2s ease;
}

.back-button:hover {
  opacity: .65;
}

footer {
  padding: 0 20px 45px;
  font-family: serif;
  font-size: 11px;
  letter-spacing: 0.14em;
  opacity: .8;
}

@media screen and (max-width: 700px) {
  .header {
    padding-top: 30px;
  }

  .header h1 {
    font-size: 31px;
  }

  .nav {
    gap: 17px;
    flex-wrap: wrap;
  }

  .nav a {
    font-size: 11px;
  }

  .shop {
    width: calc(100% - 28px);
    padding-top: 30px;
  }

  .shop-title {
    font-size: 25px;
  }

  .shop-card {
    border-radius: 24px;
    padding: 52px 20px 48px;
  }

  .shop-card h2 {
    font-size: 22px;
  }

  .shop-card p {
    font-size: 13px;
  }

  .shop-card::before {
    left: 20px;
  }

  .shop-card::after {
    right: 20px;
  }
}
</style>
</head>

<body>

<header class="header">
  <h1>SHOP</h1>
  <p>Noctiluca｜綿森りこ</p>
</header>

<nav class="nav" aria-label="メインメニュー">
  <a href="index.html">HOME</a>
  <a href="works.html">WORKS</a>
  <a href="about.html">ABOUT</a>
  <a href="exhibition.html">EXHIBITION</a>
  <a href="shop.html">SHOP</a>
  <a href="contact.html">CONTACT</a>
</nav>

<main class="shop">

  <h2 class="shop-title">ONLINE SHOP</h2>
  <p class="shop-subtitle">SHOPPING &amp; ORIGINAL WORKS</p>

  <div class="shop-grid">

    <section class="shop-card">
      <h2>SUZURI</h2>
      <p class="shop-type">ORIGINAL GOODS</p>
      <p>
        オリジナルイラストを使った<br>
        グッズを販売しています。
      </p>

      <a
        href="https://suzuri.jp/rico_watamori"
        class="shop-button"
        target="_blank"
        rel="noopener noreferrer">
        VISIT SUZURI ↗
      </a>
    </section>

    <section class="shop-card">
      <h2>Creema</h2>
      <p class="shop-type">ORIGINAL ARTWORKS</p>
      <p>
        原画やアート作品を中心に<br>
        販売しています。
      </p>

      <a
        href="https://www.creema.jp/c/artpiko"
        class="shop-button"
        target="_blank"
        rel="noopener noreferrer">
        VISIT CREEMA ↗
      </a>
    </section>

  </div>

  <a href="index.html" class="back-button">BACK TO HOME</a>

</main>

<footer>
  © Noctiluca｜綿森りこ
</footer>

</body>
</html>
