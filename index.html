<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noctiluca | 綿森りこ</title>
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: #fceff2;
    text-align: center;
  }


 * { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: #fceff2;
  text-align: center;
}

.top {
  position: relative;
  width: 100%;
  max-width: none;
  margin: 0 auto;
}
 
.top-image {
  display: block;
  width: 100%;
  height: auto;
}

  .top-image {
    display: block;
    width: 100%;
    height: auto;
  }

  /* 画像の上に透明なリンクを置きます */
  .link {
    position: absolute;
    display: block;
    z-index: 5;
  }

  .home   { left: 4%;  top: 2%; width: 7%;  height: 4%; }
  .works  { left: 13%; top: 2%; width: 8%;  height: 4%; }
  .about  { left: 23%; top: 2%; width: 8%;  height: 4%; }

  .exhibition { right: 20%; top: 2%; width: 12%; height: 4%; }
  .shop       { right: 11%; top: 2%; width: 7%;  height: 4%; }
  .contact    { right: 3%;  top: 2%; width: 8%;  height: 4%; }

  /* SCROLL部分 */
  .scroll-link {
    left: 44%;
    top: 86%;
    width: 12%;
    height: 9%;
  }

  /* マウスを乗せた場所だけ、うっすら反応 */
  .link:hover {
    background: rgba(255,255,255,.08);
  }

  @media (max-width: 700px) {
    .link:hover { background: transparent; }
  }
   .works-scroll {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 140px;
    margin: 35px auto 80px;
    color: #a96b7d;
    text-decoration: none;
    font-family: "Times New Roman", serif;
    font-size: 14px;
    letter-spacing: 3px;
  }

 

  .works-scroll:hover {
    opacity: .65;
  }
</style>
</head>

<body>

<div class="top">

  <!-- あなたが選んだTOP画像を、そのまま表示 -->
  <img class="top-image" src="noctiluca-top.png" alt="Noctiluca 綿森りこ">

  <!-- 透明なクリックエリア -->
  <a class="link home" href="index.html" aria-label="HOME"></a>
  <a class="link works" href="works.html" aria-label="WORKS"></a>
  <a class="link about" href="about.html" aria-label="ABOUT"></a>

  <a class="link exhibition" href="exhibition.html" aria-label="EXHIBITION"></a>
  <a class="link shop" href="shop.html" aria-label="SHOP"></a>
  <a class="link contact" href="contact.html" aria-label="CONTACT"></a>

</div>
