<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Noctiluca｜綿森りこ</title>

<style>

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
}

body {
  background: #fceff2;
  text-align: center;
}


/* =========================
   TOP
   ========================= */

.top {
  position: relative;
  width: 100%;
  max-width: 1226px;
  margin: 0 auto;
}

.top-image {
  display: block;
  width: 100%;
  height: auto;
}


/* =========================
   PC用リンク
   ========================= */

.link {
  position: absolute;
  display: block;
  z-index: 5;
}

.home {
  left: 4%;
  top: 2%;
  width: 7%;
  height: 4%;
}

.works {
  left: 13%;
  top: 2%;
  width: 8%;
  height: 4%;
}

.about {
  left: 23%;
  top: 2%;
  width: 8%;
  height: 4%;
}

.exhibition {
  right: 20%;
  top: 2%;
  width: 12%;
  height: 4%;
}

.shop {
  right: 11%;
  top: 2%;
  width: 7%;
  height: 4%;
}

.contact {
  right: 3%;
  top: 2%;
  width: 8%;
  height: 4%;
}

.link:hover {
  background: rgba(255, 255, 255, 0.08);
}


/* =========================
   スマホ用メニュー
   ========================= */

.menu-button {
  display: none;
}

.mobile-menu {
  display: none;
}


/* =========================
   スマートフォン
   ========================= */

@media screen and (max-width: 700px) {

  .top {
    position: relative;
    width: 100%;
    max-width: none;
    margin: 0;
  }

  .top-image {
    display: block;
    width: 100%;
    height: auto;
  }

  /* PC用の透明リンクを消す */
  .top > .link {
    display: none;
  }


  /* ハンバーガーボタン */

  .menu-button {
    display: flex;

    position: fixed;
    top: 105px;
    left: 18px;

    width: 52px;
    height: 52px;

    padding: 10px;

    border: none;
    border-radius: 12px;

    background: rgba(255, 248, 250, 0.92);

    z-index: 1000;

    flex-direction: column;
    justify-content: center;
    align-items: center;

    gap: 6px;

    cursor: pointer;
  }

  .menu-button span {
    display: block;

    width: 29px;
    height: 4px;

    border-radius: 4px;

    background: #d889aa;
  }


  /* 開いたときのメニュー */

  .mobile-menu {
    display: none;

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100vh;

    padding: 120px 30px 40px;

    background: rgba(255, 246, 249, 0.98);

    z-index: 900;
  }

  .mobile-menu.open {
    display: flex;
    flex-direction: column;
  }

  .mobile-menu a {
    display: block;

    padding: 20px 10px;

    border-bottom:
      1px solid rgba(216, 137, 170, 0.25);

    color: #a56580;

    text-decoration: none;

    font-family: serif;

    font-size: 19px;

    letter-spacing: 0.2em;

    text-align: center;
  }

}




</style>
</head>


<body>


<!-- =========================
     スマホ用ハンバーガー
     ========================= -->

<button
  class="menu-button"
  aria-label="メニュー"
  aria-expanded="false">

  <span></span>
  <span></span>
  <span></span>

</button>


<!-- =========================
     スマホ用メニュー
     ========================= -->

<nav
  class="mobile-menu"
  aria-label="スマートフォン用メニュー">

  <a href="index.html">HOME</a>
  <a href="works.html">WORKS</a>
  <a href="about.html">ABOUT</a>
  <a href="exhibition.html">EXHIBITION</a>
  <a href="shop.html">SHOP</a>
  <a href="contact.html">CONTACT</a>

</nav>


<!-- =========================
     TOP
     ========================= -->

<div class="top">

  <img
    class="top-image"
    src="noctiluca-top.png"
    alt="Noctiluca 綿森りこ">

</div>


<script>

const menuButton =
  document.querySelector('.menu-button');

const mobileMenu =
  document.querySelector('.mobile-menu');


menuButton.addEventListener('click', function () {

  const isOpen =
    mobileMenu.classList.toggle('open');

  menuButton.setAttribute(
    'aria-expanded',
    isOpen
  );

});


/* メニューを選んだら閉じる */

const menuLinks =
  document.querySelectorAll('.mobile-menu a');

menuLinks.forEach(function (link) {

  link.addEventListener('click', function () {

    mobileMenu.classList.remove('open');

    menuButton.setAttribute(
      'aria-expanded',
      'false'
    );

  });

});

</script>


</body>
</html>
