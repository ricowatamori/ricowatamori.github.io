<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Noctiluca — 綿森りこの作品世界">
<title>Noctiluca | 綿森りこ</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+JP:wght@300;400;500&display=swap');

  :root{
    --pink:#c66b86;
    --pink-light:#f9e8ec;
    --blue:#70b4cf;
    --paper:#fff9fa;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--pink-light);
    color:var(--pink);
    font-family:"Cormorant Garamond","Noto Serif JP",serif;
    overflow-x:hidden;
  }

  /* 背景の淡い絵の具 */
  body::before,
  body::after{
    content:"";
    position:fixed;
    inset:auto;
    z-index:-2;
    pointer-events:none;
    filter:blur(.2px);
  }

  body::before{
    width:70vw;
    height:46vh;
    left:-15vw;
    top:34vh;
    opacity:.42;
    background:
      radial-gradient(ellipse at 25% 55%, rgba(166,207,232,.58) 0 7%, transparent 29%),
      radial-gradient(ellipse at 55% 65%, rgba(246,180,205,.42) 0 10%, transparent 32%);
    transform:rotate(-13deg);
  }

  body::after{
    width:72vw;
    height:50vh;
    right:-17vw;
    top:31vh;
    opacity:.42;
    background:
      radial-gradient(ellipse at 70% 48%, rgba(165,205,231,.55) 0 8%, transparent 30%),
      radial-gradient(ellipse at 35% 67%, rgba(247,183,208,.4) 0 12%, transparent 34%);
    transform:rotate(12deg);
  }

  .page{
    min-height:100vh;
    position:relative;
    background:
      radial-gradient(circle at 50% 23%, rgba(255,255,255,.75), transparent 30%),
      linear-gradient(135deg, rgba(255,255,255,.25), rgba(249,218,226,.38));
  }

  /* 上部ナビ */
  .nav{
    position:absolute;
    z-index:10;
    top:28px;
    left:0;
    width:100%;
    padding:0 5.2%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    text-transform:uppercase;
    letter-spacing:.25em;
    font-size:13px;
    font-weight:500;
  }

  .nav-group{
    display:flex;
    gap:48px;
  }

  .nav a{
    color:var(--pink);
    text-decoration:none;
    transition:opacity .25s ease;
    white-space:nowrap;
  }

  .nav a:hover{opacity:.55}

  .hero{
    width:min(1226px,100%);
    min-height:100vh;
    margin:0 auto;
    position:relative;
    text-align:center;
    padding-top:82px;
    padding-bottom:42px;
  }

  /* 月 */
  .moon{
    position:relative;
    width:62px;
    height:62px;
    margin:0 auto 3px;
  }

  .moon::before{
    content:"";
    position:absolute;
    width:54px;
    height:54px;
    left:2px;
    top:0;
    border-radius:50%;
    background:var(--pink);
  }

  .moon::after{
    content:"";
    position:absolute;
    width:49px;
    height:49px;
    left:16px;
    top:-4px;
    border-radius:50%;
    background:var(--pink-light);
  }

  .star{
    position:absolute;
    right:-1px;
    top:3px;
    width:16px;
    height:16px;
  }

  .star::before,.star::after{
    content:"";
    position:absolute;
    left:7px;
    top:0;
    width:1px;
    height:16px;
    background:var(--pink);
  }

  .star::after{transform:rotate(90deg)}

  /* ロゴ */
  .brand{
    position:relative;
    display:inline-block;
  }

  .brand h1{
    margin:0;
    font-size:clamp(76px,9.2vw,120px);
    line-height:.85;
    font-weight:500;
    letter-spacing:-.035em;
    color:var(--pink);
  }

  .underline{
    width:345px;
    max-width:75vw;
    height:34px;
    margin:-3px auto 0;
    border-top:2px solid rgba(198,107,134,.72);
    border-radius:50%;
    transform:rotate(-5deg);
  }

  .artist{
    margin-top:-2px;
    color:var(--blue);
  }

  .artist-jp{
    font-family:"Noto Serif JP",serif;
    font-size:29px;
    letter-spacing:.38em;
    margin-right:-.38em;
  }

  .artist-en{
    margin-top:5px;
    font-size:15px;
    letter-spacing:.34em;
  }

  /* 中央作品 */
  .art-wrap{
    width:min(590px,54vw);
    margin:31px auto 0;
    position:relative;
    z-index:2;
  }

  .art-wrap::after{
    content:"";
    position:absolute;
    z-index:-1;
    left:7%;
    right:7%;
    bottom:-18px;
    height:30px;
    border-radius:50%;
    background:rgba(151,91,104,.20);
    filter:blur(17px);
  }

  .art-wrap img{
    display:block;
    width:100%;
    height:auto;
    border:1px solid rgba(115,89,91,.45);
    box-shadow:0 5px 14px rgba(95,75,81,.12);
  }

  /* コピー */
  .tagline{
    margin-top:54px;
    font-family:"Noto Serif JP",serif;
    font-size:19px;
    line-height:2.15;
    letter-spacing:.28em;
    margin-left:.28em;
  }

  .scroll{
    margin:22px auto 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:9px;
  }

  .scroll-line{
    width:1px;
    height:34px;
    background:var(--pink);
    opacity:.8;
  }

  .scroll-label{
    font-size:12px;
    letter-spacing:.38em;
    margin-left:.38em;
  }

  .chevron{
    width:10px;
    height:10px;
    border-right:1px solid var(--pink);
    border-bottom:1px solid var(--pink);
    transform:rotate(45deg);
    margin-top:-3px;
  }

  /* 背景の筆線 */
  .brush{
    position:absolute;
    pointer-events:none;
    z-index:0;
    border-radius:50%;
  }

  .brush-left{
    left:-8%;
    bottom:4%;
    width:43%;
    height:82px;
    border-top:12px solid rgba(245,163,194,.48);
    transform:rotate(8deg);
    filter:blur(1px);
  }

  .brush-left::after{
    content:"";
    position:absolute;
    width:70%;
    height:28px;
    left:3%;
    top:14px;
    border-top:4px solid rgba(250,190,210,.55);
    border-radius:50%;
  }

  .brush-right{
    right:-10%;
    top:27%;
    width:42%;
    height:120px;
    border-top:11px solid rgba(178,208,234,.42);
    transform:rotate(-18deg);
    filter:blur(1px);
  }

  /* 右側の縦コピー */
  .side-copy{
    position:absolute;
    right:3.4%;
    top:34%;
    writing-mode:vertical-rl;
    font-family:"Noto Serif JP",serif;
    font-size:16px;
    letter-spacing:.42em;
    line-height:2.1;
    color:rgba(198,107,134,.75);
    z-index:1;
  }

  .side-copy span{display:block}

  .side-en{
    position:absolute;
    left:4%;
    top:37%;
    writing-mode:vertical-rl;
    font-size:10px;
    letter-spacing:.26em;
    color:rgba(198,107,134,.55);
    z-index:1;
  }

  .footer-note{
    position:absolute;
    right:4%;
    bottom:30px;
    font-size:10px;
    letter-spacing:.18em;
    color:rgba(198,107,134,.62);
  }

  /* 下の仮WORKS */
  #works{
    min-height:70vh;
    padding:110px 7vw;
    background:#fffafb;
    text-align:center;
  }

  #works h2{
    font-size:45px;
    font-weight:400;
    letter-spacing:.12em;
    margin:0 0 12px;
  }

  #works p{
    font-family:"Noto Serif JP",serif;
    color:#9c8290;
    letter-spacing:.15em;
  }

  /* スマホ */
  @media(max-width:760px){
    .nav{
      top:18px;
      padding:0 18px;
      font-size:10px;
      letter-spacing:.16em;
    }

    .nav-group{gap:15px}

    .hero{
      padding-top:73px;
      min-height:100svh;
    }

    .moon{
      transform:scale(.72);
      margin-bottom:-8px;
    }

    .brand h1{
      font-size:clamp(58px,18vw,82px);
    }

    .underline{
      width:245px;
      height:26px;
    }

    .artist-jp{font-size:21px}
    .artist-en{font-size:11px}

    .art-wrap{
      width:72vw;
      margin-top:25px;
    }

    .tagline{
      margin-top:37px;
      font-size:14px;
      letter-spacing:.18em;
    }

    .side-copy,.side-en,.footer-note{display:none}

    .brush-left{bottom:3%;width:65%}
    .brush-right{top:32%;width:55%}
  }
</style>
</head>

<body>
<main class="page">

  <nav class="nav" aria-label="メインナビゲーション">
    <div class="nav-group">
      <a href="index.html">HOME</a>
      <a href="#works">WORKS</a>
      <a href="about.html">ABOUT</a>
    </div>

    <div class="nav-group">
      <a href="exhibition.html">EXHIBITION</a>
      <a href="shop.html">SHOP</a>
      <a href="contact.html">CONTACT</a>
    </div>
  </nav>

  <section class="hero">

    <div class="moon" aria-hidden="true">
      <span class="star"></span>
    </div>

    <div class="brand">
      <h1>Noctiluca</h1>
      <div class="underline" aria-hidden="true"></div>
    </div>

    <div class="artist">
      <div class="artist-jp">綿森りこ</div>
      <div class="artist-en">RICO WATAMORI</div>
    </div>

    <div class="art-wrap">
      <!-- 中央の作品。IMG_0709.jpg はGitHubの同じフォルダに置いてください -->
      <img src="IMG_0709.jpg" alt="綿森りこ 作品">
    </div>

    <p class="tagline">やさしい色が、<br>こころのどこかを灯す。</p>

    <div class="scroll" aria-hidden="true">
      <div class="scroll-line"></div>
      <div class="scroll-label">SCROLL</div>
      <div class="chevron"></div>
    </div>

    <div class="brush brush-left" aria-hidden="true"></div>
    <div class="brush brush-right" aria-hidden="true"></div>

    <div class="side-copy" aria-hidden="true">
      <span>絵と、</span>
      <span>小さな物語。</span>
    </div>

    <div class="side-en" aria-hidden="true">A SMALL WORLD IN COLORS</div>

    <div class="footer-note">PAINTING / ILLUSTRATION / AND STORIES</div>

  </section>

  <section id="works">
    <h2>WORKS</h2>
    <p>ここから作品一覧へ続きます。</p>
  </section>

</main>
</body>
</html>
