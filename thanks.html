<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thank You｜綿森りこ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background: #f8e8ed;
    }

    .thank-you-page {
      position: relative;
      width: 100vw;
      height: 100vh;

      background-image: url("Thankyou.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* BACK TO HOME のクリック部分 */
    .home-link {
      position: absolute;

      left: 50%;
      bottom: 24%;

      transform: translateX(-50%);

      width: 280px;
      height: 65px;

      display: block;

      text-decoration: none;
      cursor: pointer;

      /* 見た目は透明 */
      background: transparent;
    }

    .home-link:hover {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 40px;
    }

    @media (max-width: 600px) {

      .thank-you-page {
        background-size: cover;
      }

      .home-link {
        width: 220px;
        height: 55px;
        bottom: 20%;
      }
    }
  </style>
</head>

<body>

  <main class="thank-you-page">

    <a href="index.html" class="home-link" aria-label="Back to Home"></a>

  </main>

</body>
</html>
