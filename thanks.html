<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thank You｜綿森りこ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Georgia, "Times New Roman", serif;
      color: #8f657b;

      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.8), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(190,210,235,.35), transparent 30%),
        linear-gradient(135deg, #f8e8ed, #f4eef5 45%, #e9eef7);
    }

    .thank-you {
      width: min(90%, 600px);
      padding: 70px 30px;
      text-align: center;
    }

    .ornament {
      font-size: 20px;
      letter-spacing: 8px;
      margin-bottom: 25px;
      opacity: .8;
    }

    .small-title {
      font-size: 13px;
      letter-spacing: 5px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 10vw, 72px);
      font-weight: normal;
      letter-spacing: 8px;
    }

    .japanese {
      margin-top: 25px;
      font-size: 15px;
      letter-spacing: 2px;
      line-height: 2;
    }

    .message {
      margin-top: 35px;
      font-family: sans-serif;
      font-size: 13px;
      line-height: 2.2;
      letter-spacing: 1px;
    }

    .divider {
      margin: 40px auto;
      width: 150px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: rgba(143,101,123,.35);
      flex: 1;
    }

    .star {
      font-size: 13px;
    }

    .home {
      display: inline-block;
      margin-top: 10px;
      padding: 14px 35px;
      border: 1px solid rgba(143,101,123,.45);
      border-radius: 30px;
      color: #8f657b;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 3px;
      transition: .3s;
    }

    .home:hover {
      background: rgba(255,255,255,.55);
      transform: translateY(-2px);
    }

    .moon {
      position: fixed;
      top: 12%;
      right: 12%;
      font-size: 28px;
      opacity: .35;
    }

    .sparkle {
      position: fixed;
      bottom: 15%;
      left: 12%;
      font-size: 18px;
      opacity: .35;
    }
  </style>
</head>

<body>

  <div class="moon">☾</div>
  <div class="sparkle">✦</div>

  <main class="thank-you">

    <div class="ornament">✦　✧　✦</div>

    <div class="small-title">
      MESSAGE SENT
    </div>

    <h1>THANK YOU</h1>

    <div class="japanese">
      ご連絡ありがとうございます。
    </div>

    <div class="message">
      メッセージを無事受け取りました。<br>
      お問い合わせいただき、ありがとうございます。
    </div>

    <div class="divider">
      <span class="star">✦</span>
    </div>

    <a href="index.html" class="home">
      BACK TO HOME
    </a>

  </main>

</body>
</html>
